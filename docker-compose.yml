services:
  # ─── Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:latest
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
      # The generated site scripts live on their own volume (it must survive
      # an update, which replaces app-public). nginx serves them straight from
      # disk, so without this mount every /sites_data/<key>/script.js is a 404
      # and no banner ever shows.
      - app-sites-data:/var/www/html/public/sites_data:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ─── PHP-FPM Application ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    volumes:
      - app-public:/var/www/html/public
      - app-sites-data:/var/www/html/public/sites_data
      # Backups MUST be a named volume. Written into the image layer they look
      # successful, stay downloadable while the container lives, and are
      # destroyed by the next deploy — a backup that reports success and does
      # not survive is worse than none. The worker writes them and the app
      # serves the downloads, so both need the same disk.
      - app-backups:/var/www/html/backups
      - app-var:/var/www/html/var
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Conzent}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - CMP_ID=${CMP_ID:-}
      - CMP_VERSION=${CMP_VERSION:-}
      - CDN_URL=${CDN_URL:-}
      - DISABLE_CACHE=${DISABLE_CACHE:-false}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - SCANNER_URL=${SCANNER_URL:-http://scanner:8300}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - SCANNER_CALLBACK_URL=${SCANNER_CALLBACK_URL:-}
      - SCANNER_WEBHOOK_SECRET=${SCANNER_WEBHOOK_SECRET:-}
      # scanner:register runs here and records how many scans the scanner
      # takes at once; it must be the number the scanner service runs with.
      - SCANNER_MAX_CONCURRENT=${SCANNER_MAX_CONCURRENT:-3}
      # Without TOTP_ENCRYPTION_KEY two-factor enrolment is refused; without
      # CONSENT_IP_KEY consent-log IPs are truncated instead of pseudonymised.
      # Empty keeps that behaviour rather than failing at start.
      - TOTP_ENCRYPTION_KEY=${TOTP_ENCRYPTION_KEY:-}
      - CONSENT_IP_KEY=${CONSENT_IP_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - IPREGISTRY_API_KEY=${IPREGISTRY_API_KEY:-}
      # Defaults match the code's own when a variable is absent.
      - GVL_AUTO_UPDATE=${GVL_AUTO_UPDATE:-true}
      - GVL_SOURCE_URL=${GVL_SOURCE_URL:-}
      - GVL_LANGUAGES=${GVL_LANGUAGES:-}
      - GVL_UPDATE_ATP=${GVL_UPDATE_ATP:-true}
      - GVL_ARCHIVE_KEEP=${GVL_ARCHIVE_KEEP:-10}
      - MONETIZATION_MODEL=oci
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ─── Queue Worker ────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/oci", "queue:work"]
    volumes:
      # The worker reads the IAB vendor list under public/ when it regenerates
      # a site script; it must be the list the scheduler keeps fresh.
      - app-public:/var/www/html/public
      - app-var:/var/www/html/var
      - app-sites-data:/var/www/html/public/sites_data
      # Backups MUST be a named volume. Written into the image layer they look
      # successful, stay downloadable while the container lives, and are
      # destroyed by the next deploy — a backup that reports success and does
      # not survive is worse than none. The worker writes them and the app
      # serves the downloads, so both need the same disk.
      - app-backups:/var/www/html/backups
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      # Unset means debug ON in the code, so it is passed to every PHP service.
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - MONETIZATION_MODEL=oci
      # Decrypts the SFTP/S3 backup destination credentials the worker ships to.
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SCANNER_URL=${SCANNER_URL:-http://scanner:8300}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - SCANNER_CALLBACK_URL=${SCANNER_CALLBACK_URL:-}
      - SCANNER_WEBHOOK_SECRET=${SCANNER_WEBHOOK_SECRET:-}
      # Scripts regenerated here must match the ones the app writes.
      - CMP_ID=${CMP_ID:-}
      - CMP_VERSION=${CMP_VERSION:-}
      - CDN_URL=${CDN_URL:-}
      - DISABLE_CACHE=${DISABLE_CACHE:-false}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      # A completed scan emails the cookie-change alert from this worker.
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Conzent}
    restart: unless-stopped

  # ─── Scheduler (cron replacement) ───────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/oci", "schedule:run"]
    volumes:
      # The scheduler refreshes the IAB vendor list (and writes the cookie
      # pages, when switched on) under public/. Without the shared volume the
      # files land in this container only: nginx and the app keep the list
      # from the image and the refresh is lost on the next restart.
      - app-public:/var/www/html/public
      - app-var:/var/www/html/var
      - app-sites-data:/var/www/html/public/sites_data
      # Backups MUST be a named volume. Written into the image layer they look
      # successful, stay downloadable while the container lives, and are
      # destroyed by the next deploy — a backup that reports success and does
      # not survive is worse than none. The worker writes them and the app
      # serves the downloads, so both need the same disk.
      - app-backups:/var/www/html/backups
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - MONETIZATION_MODEL=oci
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SCANNER_URL=${SCANNER_URL:-http://scanner:8300}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - SCANNER_CALLBACK_URL=${SCANNER_CALLBACK_URL:-}
      - SCANNER_WEBHOOK_SECRET=${SCANNER_WEBHOOK_SECRET:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Conzent}
      # Backup retention reaches the SFTP/S3 destinations, whose credentials
      # are encrypted with APP_SECRET.
      - APP_SECRET=${APP_SECRET}
      - SCANNER_ALERT_EMAIL=${SCANNER_ALERT_EMAIL:-}
      - SCANNER_ALERT_FAILURES=${SCANNER_ALERT_FAILURES:-2}
      # The nightly purge; an empty value would read as 0 = keep forever.
      - CONSENT_LOG_RETENTION_DAYS=${CONSENT_LOG_RETENTION_DAYS:-1095}
      - GVL_AUTO_UPDATE=${GVL_AUTO_UPDATE:-true}
      - GVL_SOURCE_URL=${GVL_SOURCE_URL:-}
      - GVL_LANGUAGES=${GVL_LANGUAGES:-}
      - GVL_UPDATE_ATP=${GVL_UPDATE_ATP:-true}
      - GVL_ARCHIVE_KEEP=${GVL_ARCHIVE_KEEP:-10}
    restart: unless-stopped

  # ─── Beacon Flush Worker ─────────────────────────────────
  # Drains the Redis beacon buffer written by the consent script
  # (cookies observed on live pages) into the database. Without it
  # buffered beacons are evicted by Redis' maxmemory policy.
  beacon-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/oci", "ingest:flush"]
    volumes:
      - app-var:/var/www/html/var
      - app-sites-data:/var/www/html/public/sites_data
      # Backups MUST be a named volume. Written into the image layer they look
      # successful, stay downloadable while the container lives, and are
      # destroyed by the next deploy — a backup that reports success and does
      # not survive is worse than none. The worker writes them and the app
      # serves the downloads, so both need the same disk.
      - app-backups:/var/www/html/backups
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - MONETIZATION_MODEL=oci
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped

  # ─── Cookie Scanner ──────────────────────────────────────
  # Headless Chromium scanning server. Reachable from app/worker/
  # scheduler at http://scanner:8300 over the compose network — no
  # host port is published. To expose it to other machines, add a
  # ports mapping in docker-compose.override.yml.
  scanner:
    build:
      context: ./docker/scanner
      dockerfile: Dockerfile
    environment:
      - PORT=8300
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - MAX_CONCURRENT=${SCANNER_MAX_CONCURRENT:-3}
      - SCAN_TIMEOUT=${SCANNER_TIMEOUT:-60000}
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ─── MariaDB ─────────────────────────────────────────────
  mariadb:
    image: mariadb:latest
    volumes:
      - oci-db-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-oci}
      MARIADB_USER: ${DB_USER:-oci}
      MARIADB_PASSWORD: ${DB_PASSWORD:-oci}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:latest
    volumes:
      - oci-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  app-backups:
    driver: local
  oci-db-data:
    driver: local
  oci-redis-data:
    driver: local
  app-public:
    driver: local
  app-var:
    driver: local
  app-sites-data:
    driver: local

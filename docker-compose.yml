services:
  # ─── Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:latest
    ports:
      - "${APP_PORT:-80}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - app-public:/var/www/html/public:ro
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  # ─── PHP-FPM Application ─────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    volumes:
      - app-public:/var/www/html/public
      - app-sites-data:/var/www/html/public/sites_data
      - app-var:/var/www/html/var
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - APP_SECRET=${APP_SECRET}
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Conzent}
      - CMP_ID=${CMP_ID:-}
      - CDN_URL=${CDN_URL:-}
      - SCANNER_URL=${SCANNER_URL:-http://scanner:8300}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - SCANNER_CALLBACK_URL=${SCANNER_CALLBACK_URL:-}
      - MONETIZATION_MODEL=oci
    healthcheck:
      test: ["CMD-SHELL", "php-fpm-healthcheck || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ─── Queue Worker ────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/oci", "queue:work"]
    volumes:
      - app-var:/var/www/html/var
      - app-sites-data:/var/www/html/public/sites_data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost}
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SCANNER_URL=${SCANNER_URL:-http://scanner:8300}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - SCANNER_CALLBACK_URL=${SCANNER_CALLBACK_URL:-}
    restart: unless-stopped

  # ─── Scheduler (cron replacement) ───────────────────────
  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/oci", "schedule:run"]
    volumes:
      - app-var:/var/www/html/var
      - app-sites-data:/var/www/html/public/sites_data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost}
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - SCANNER_URL=${SCANNER_URL:-http://scanner:8300}
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - SCANNER_CALLBACK_URL=${SCANNER_CALLBACK_URL:-}
      - MAIL_HOST=${MAIL_HOST:-}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-Conzent}
    restart: unless-stopped

  # ─── Beacon Flush Worker ─────────────────────────────────
  # Drains the Redis beacon buffer written by the consent script
  # (cookies observed on live pages) into the database. Without it
  # buffered beacons are evicted by Redis' maxmemory policy.
  beacon-worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: prod
    command: ["php", "bin/oci", "ingest:flush"]
    volumes:
      - app-var:/var/www/html/var
      - app-sites-data:/var/www/html/public/sites_data
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DATABASE_URL=${DATABASE_URL:-mysql://oci:oci@mariadb:3306/oci?charset=utf8mb4}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
    restart: unless-stopped

  # ─── Cookie Scanner ──────────────────────────────────────
  # Headless Chromium scanning server. Reachable from app/worker/
  # scheduler at http://scanner:8300 over the compose network — no
  # host port is published. To expose it to other machines, add a
  # ports mapping in docker-compose.override.yml.
  scanner:
    build:
      context: ./docker/scanner
      dockerfile: Dockerfile
    environment:
      - PORT=8300
      - SCANNER_API_KEY=${SCANNER_API_KEY:-}
      - MAX_CONCURRENT=${SCANNER_MAX_CONCURRENT:-3}
      - SCAN_TIMEOUT=${SCANNER_TIMEOUT:-60000}
    shm_size: '256m'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8300/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  # ─── MariaDB ─────────────────────────────────────────────
  mariadb:
    image: mariadb:latest
    volumes:
      - oci-db-data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-oci}
      MARIADB_USER: ${DB_USER:-oci}
      MARIADB_PASSWORD: ${DB_PASSWORD:-oci}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:latest
    volumes:
      - oci-redis-data:/data
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  oci-db-data:
    driver: local
  oci-redis-data:
    driver: local
  app-public:
    driver: local
  app-var:
    driver: local
  app-sites-data:
    driver: local

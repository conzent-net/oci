server {
    listen 80;
    server_name localhost;
    root /var/www/html/public;
    index index.php;

    # Backup archives are uploaded through /admin/backup/upload for restore
    # onto this server. nginx defaults to 1 MB, which silently 413s a real
    # archive; the admin-only route is the only place a body this size is
    # accepted, and PHP has its own limit on top (see docker/php/php.ini).
    client_max_body_size 1m;

    location = /admin/backup/upload {
        client_max_body_size 2048m;
        client_body_timeout 600s;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_read_timeout 600s;
        fastcgi_send_timeout 600s;
    }

    # The scanner posts every page's results for a scan in one callback, and a
    # scan with a before and after consent pass per page outgrows 1 MB. The
    # location passes to PHP itself: a try_files hop to index.php would apply
    # the server's 1 MB limit again and 413 the callback, leaving the scan
    # running forever.
    location = /api/v1/scan-webhook {
        client_max_body_size 16m;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        include fastcgi_params;
        fastcgi_read_timeout 120s;
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;

    # Static assets — serve directly (hashed filenames, immutable)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Media files (logos, icons) — rarely change, long cache with revalidation
    location /media/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, s-maxage=2592000";
        try_files $uri =404;
    }

    # Generated consent scripts — serve directly with CORS
    # Uses ?v=hash query param for cache-busting on save
    location /sites_data/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Vary "Accept-Encoding" always;

        # Dev: no-cache, no-store to prevent stale scripts during development
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # Version file should never be cached
        location ~ /version\.json$ {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            try_files $uri =404;
        }

        try_files $uri =404;
    }

    # CMP loader script — edge-cached 24h, browser revalidates via ETag. Purged on deploy.
    location /c/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=0, s-maxage=86400" always;
        try_files $uri =404;
    }

    # Legacy CMP loader path — redirect to new path
    location /cmp/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    # IAB TCF vendor list — serve with CORS (cross-origin banner scripts need this)
    # Short max-age so a daily GVL refresh reaches visitors within the hour;
    # stale-while-revalidate keeps the edge warm so nobody waits on the origin.
    location /iab/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        try_files $uri =404;
    }

    # Health check (bypass PHP for fast probe)
    location = /health {
        try_files $uri /index.php$is_args$args;
    }

    # Chat AI widget + WebSocket — proxy to chat-ai service (same-origin)
    # Use variable so nginx doesn't crash when chat-ai is down
    resolver 127.0.0.11 valid=30s;
    set $chat_upstream http://chat-ai:3000;

    location /chat/ {
        proxy_pass $chat_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /chat/ws {
        proxy_pass $chat_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # Public cookie database (see production.conf for the full story): static
    # pages under public/cookie, served without PHP. `^~` keeps the dotfile
    # block from 403ing cookies whose names start with a dot.
    location = /cookie {
        absolute_redirect off;
        return 301 /cookie/;
    }
    location = /cookie/ {
        absolute_redirect off;
        if ($arg_q ~ "^(.+?)\*+$") { return 302 /cookie/$1/; }
        if ($arg_q) { return 302 /cookie/$arg_q/; }
        try_files /cookie/index.html =404;
    }
    location ^~ /cookie/ {
        absolute_redirect off;
        index index.html;
        error_page 404 /cookie/not-found/index.html;
        try_files $uri $uri/ =404;
    }

    # All requests → PHP front controller
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;

        # Timeouts
        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout 30s;
        fastcgi_read_timeout 60s;
    }

    # /.well-known/ is a dotted path but a PUBLIC one, so it must be matched
    # before the dotfile deny below or nginx blocks it. Two things depend on
    # it: security.txt (RFC 9116) and, more importantly for self-hosted
    # installs, ACME http-01 challenges — Let's Encrypt renewals fail with a
    # 403 that looks nothing like a certificate problem.
    location ^~ /.well-known/ {
        allow all;
        try_files $uri =404;
    }

    # Block access to dotfiles and sensitive paths
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(legacy|var|config|src|tests|migrations|docker|development|vendor|bin)/ {
        deny all;
    }
}
